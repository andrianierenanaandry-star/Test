<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS CHAT V17</title>
    <style>
        :root { --jarvis: #00e5ff; --bg: #0b0f19; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        .header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(0, 229, 255, 0.2); }
        .header h1 { margin: 0; font-size: 18px; color: var(--jarvis); letter-spacing: 2px; }

        /* Zone de Chat */
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .user-bubble { align-self: flex-end; background: var(--jarvis); color: black; }
        .ai-bubble { align-self: flex-start; background: #1a2235; border: 1px solid #2d3748; }

        /* Menu Flottant (Choix) */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        .option-btn { width: 80%; padding: 20px; background: #1a2235; border: 2px solid var(--jarvis); color: white; border-radius: 12px; font-weight: bold; text-align: center; cursor: pointer; }

        /* Zone d'entrée */
        .input-bar { padding: 15px; background: #161c2d; display: flex; align-items: center; gap: 10px; }
        #jarvis-btn { width: 50px; height: 50px; border: 2px solid var(--jarvis); border-radius: 50%; background: black; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--jarvis); flex-shrink: 0; }
        #jarvis-btn div { width: 15px; height: 15px; background: var(--jarvis); border-radius: 50%; }
        #text-input { flex-grow: 1; background: #0b0f19; border: 1px solid #2d3748; padding: 12px; border-radius: 20px; color: white; }

        #loader { display: none; text-align: center; color: var(--jarvis); font-size: 12px; padding: 5px; }
    </style>
</head>
<body>

    <div class="header"><h1>JARVIS V17</h1></div>

    <div id="chat-box">
        <div class="bubble ai-bubble">Monsieur, le système est prêt. Appuyez sur le bouton central pour scanner votre écran ou un lien.</div>
    </div>

    <div id="loader">Jarvis analyse les données...</div>

    <!-- Menu de choix -->
    <div id="overlay" onclick="closeMenu()">
        <div class="option-btn" onclick="openGallery()">📷 ANALYSER L'ÉCRAN</div>
        <div class="option-btn" onclick="askLink()">🔗 ANALYSER UN LIEN</div>
        <div style="color: grey; font-size: 12px;">ANNULER</div>
    </div>

    <div class="input-bar">
        <div id="jarvis-btn" onclick="openMenu()"><div></div></div>
        <input type="text" id="text-input" placeholder="Posez une question...">
        <button onclick="sendText()" style="background:none; border:none; color:var(--jarvis); font-weight:bold;">OK</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="processImage(event)">

    <!-- Zone Clé API (très discrète) -->
    <input type="password" id="apiKey" placeholder="Clé Mistral" style="position:fixed; bottom:0; right:0; width:50px; opacity:0.1;" onchange="saveKey(this.value)">

<script>
    const chatBox = document.getElementById('chat-box');
    const loader = document.getElementById('loader');
    const overlay = document.getElementById('overlay');

    // Sauvegarde et chargement de la clé
    function saveKey(val) { localStorage.setItem('mistral_key', val.trim()); }
    window.onload = () => { 
        const k = localStorage.getItem('mistral_key'); 
        if(k) document.getElementById('apiKey').value = k; 
    };

    function openMenu() { overlay.style.display = 'flex'; }
    function closeMenu() { overlay.style.display = 'none'; }

    function openGallery() { document.getElementById('fileInput').click(); }

    function askLink() {
        const url = prompt("Veuillez coller le lien Facebook ou Web ici :");
        if(url) runAI(url, false);
    }

    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = `bubble ${role === 'user' ? 'user-bubble' : 'ai-bubble'}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendText() {
        const txt = document.getElementById('text-input').value;
        if(txt) {
            document.getElementById('text-input').value = "";
            runAI(txt, false);
        }
    }

    async function processImage(e) {
        const file = e.target.files[0];
        if(!file) return;
        addBubble('user', "[Screenshot envoyé]");
        const base64 = await new Promise(r => {
            const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file);
        });
        runAI(base64, true);
    }

    async function runAI(content, isImage) {
        const key = document.getElementById('apiKey').value || localStorage.getItem('mistral_key');
        if(!key) { alert("Veuillez coller votre clé Mistral en bas à droite"); return; }
        
        if(!isImage) addBubble('user', content);
        loader.style.display = 'block';

        const prompt = "Agis comme Jarvis. Si c'est un screenshot de vente chinois, traduis et explique prix, produit et fiabilité. Si c'est un lien, explique le contenu. Sois très précis et brillant.";

        let payload
