<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS V5</title>
    <style>
        :root { --neon: #00fbff; }
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        #jarvis-btn {
            width: 80px; height: 80px; border: 3px solid var(--neon); border-radius: 50%;
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--neon); background: #111; cursor: pointer;
        }
        #panel { padding: 20px; background: #111; border: 1px solid var(--neon); margin: 15px; border-radius: 15px; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #222; color: white; border: 1px solid #333; }
        button { background: var(--neon); font-weight: bold; cursor: pointer; }
        #log { margin-top: 20px; padding: 15px; background: #000; border-radius: 8px; border-left: 4px solid var(--neon); text-align: left; font-size: 13px; }
    </style>
</head>
<body>

    <p style="color:var(--neon); font-size: 10px; margin-top: 10px;">SYSTÈME JARVIS - VERSION 5 ACTIVE</p>

    <div id="jarvis-btn" onclick="document.getElementById('fileInput').click()">
        <span style="color:var(--neon); font-weight:bold;">SCAN</span>
    </div>

    <div id="panel">
        <input type="text" id="urlInput" placeholder="Coller un lien ici...">
        <button onclick="startAI('link')">ANALYSER LE LIEN</button>
        
        <div id="log">En attente...</div>

        <input type="password" id="apiKey" placeholder="Clé API AIza..." onchange="localStorage.setItem('j_key', this.value)">
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="startAI('image')">
    </div>

<script>
    window.onload = () => {
        const saved = localStorage.getItem('j_key');
        if(saved) document.getElementById('apiKey').value = saved;
    }

    async function startAI(type) {
        const key = document.getElementById('apiKey').value.trim();
        const log = document.getElementById('log');
        if(!key) { alert("Mets ta clé API !"); return; }

        log.innerHTML = "Jarvis réfléchit...";

        // ON FORCE LA VERSION 1 STABLE ET LE MODELE SANS BETA
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;

        let prompt = (type === 'link') ? 
            "Analyse ce lien et explique moi tout : " + document.getElementById('urlInput').value :
            "Traduis et explique cet écran précisément.";

        let body = { contents: [{ parts: [{ text: prompt }] }] };

        if(type === 'image') {
            const file = document.getElementById('fileInput').files[0];
            const base64 = await new Promise(r => {
                const rd = new FileReader();
                rd.onload = () => r(rd.result.split(',')[1]);
                rd.readAsDataURL(file);
            });
            body.contents[0].parts.push({ inline_data: { mime_type: "image/jpeg", data: base64 } });
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            if (data.error) {
                log.innerHTML = "<b style='color:red'>ERREUR GOOGLE :</b> " + data.error.message;
            } else {
                log.innerHTML = "<b>JARVIS :</b><br><br>" + data.candidates[0].content.parts[0].text.replace(/\n/g, "<br>");
            }
        } catch (e) {
            log.innerHTML = "Erreur de connexion.";
        }
    }
</script>
</body>
</html>
