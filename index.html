<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS CHAT</title>
    <style>
        :root { --jarvis: #00d4ff; --bg: #050a10; --card: #0f172a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* En-tête */
        .header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(0, 212, 255, 0.2); background: rgba(15, 23, 42, 0.8); }
        .header h1 { margin: 0; font-size: 16px; letter-spacing: 3px; color: var(--jarvis); }

        /* Fenêtre de Discussion */
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; position: relative; }
        .msg.user { align-self: flex-end; background: var(--jarvis); color: black; border-bottom-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: var(--card); border: 1px solid rgba(0, 212, 255, 0.3); border-bottom-left-radius: 2px; }
        
        /* Menu de commande Jarvis */
        #menu-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100;
            justify-content: center; align-items: center; flex-direction: column; gap: 20px;
        }
        .cmd-btn { 
            width: 80%; padding: 20px; background: var(--card); border: 1px solid var(--jarvis); 
            color: white; border-radius: 15px; font-weight: bold; cursor: pointer; text-align: center;
        }

        /* Bouton Central JARVIS */
        .input-area { padding: 15px; background: var(--card); display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(0, 212, 255, 0.2); }
        #jarvis-trigger {
            width: 50px; height: 50px; border: 2px solid var(--jarvis); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px var(--jarvis); cursor: pointer; background: black; flex-shrink: 0;
        }
        #text-input { flex-grow: 1; background: #1e293b; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; }

        /* Chargement */
        .typing { font-size: 12px; color: var(--jarvis); margin-bottom: 10px; display: none; }
        
        /* Cacher l'input file */
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>JARVIS INTELLIGENCE</h1>
    </div>

    <div id="chat-window">
        <div class="msg ai">Bonjour Monsieur. En quoi puis-je vous aider aujourd'hui ? Appuyez sur le bouton JARVIS pour scanner votre écran ou un lien.</div>
    </div>

    <div id="typing-indicator" class="typing" style="padding: 0 20px;">Jarvis analyse les données...</div>

    <!-- Menu Flottant -->
    <div id="menu-overlay" onclick="toggleMenu()">
        <div class="cmd-btn" onclick="triggerScan()">📷 ANALYSER MON ÉCRAN</div>
        <div class="cmd-btn" onclick="triggerLink()">🔗 ANALYSER UN LIEN</div>
        <div style="color: var(--jarvis); font-size: 12px;">ANNULER</div>
    </div>

    <div class="input-area">
        <div id="jarvis-trigger" onclick="toggleMenu()">
            <div style="width: 15px; height: 15px; background: var(--jarvis); border-radius: 50%; box-shadow: 0 0 10px var(--jarvis);"></div>
        </div>
        <input type="text" id="text-input" placeholder="Posez une question ou collez un lien...">
        <button onclick="sendText()" style="background:none; border:none; color:var(--jarvis); font-weight:bold; cursor:pointer;">ENVOYER</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">

    <!-- Config Clé API (cachée en bas) -->
    <div style="padding: 5px; opacity: 0.2;">
        <input type="password" id="apiKey" placeholder="Clé Mistral" style="font-size: 8px; width: 50px;" onchange="localStorage.setItem('v16_key', this.value)">
    </div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const menuOverlay = document.getElementById('menu-overlay');
    const typingIndicator = document.getElementById('typing-indicator');
    const textInput = document.getElementById('text-input');

    window.onload = () => {
        const key = localStorage.getItem('v16_key');
        if(key) document.getElementById('apiKey').value = key;
    };

    function toggleMenu() {
        menuOverlay.style.display = (menuOverlay.style.display === 'flex') ? 'none' : 'flex';
    }

        const msgDiv = document.createElement('div');

        msgDiv.innerHTML = text.replace(/\n/g, "<br>");
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
