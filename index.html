<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mini Overlay</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Barre de contrôle compacte */
        .toolbar {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: #222;
            border-bottom: 1px solid #444;
        }

        button {
            flex: 1;
            padding: 10px 5px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-green { background: #2e7d32; color: white; }
        .btn-blue { background: #1565c0; color: white; }
        .btn-red { background: #c62828; color: white; }

        #api-config {
            padding: 5px;
            background: #333;
        }

        input {
            width: 90%;
            padding: 5px;
            font-size: 10px;
        }

        /* Zone de résultat optimisée */
        #results {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
            line-height: 1.4;
            background: #000;
        }

        .translation-block {
            border-left: 3px solid #1565c0;
            padding-left: 8px;
            margin-bottom: 15px;
        }

        .status {
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }

        video, canvas { display: none; }
    </style>
</head>
<body>

<div id="api-config">
    <input type="password" id="apiKey" placeholder="Clé Gemini API...">
</div>

<div class="toolbar">
    <button class="btn-green" id="startBtn">1. Partager</button>
    <button class="btn-blue" id="analyzeBtn" disabled>2. Analyser</button>
    <button class="btn-red" id="autoBtn" disabled>Auto: OFF</button>
</div>

<div id="status" class="status">Prêt</div>

<div id="results">
    <em>Le résultat apparaîtra ici. Utilisez le mode écran scindé avec votre app de vente.</em>
</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const autoBtn = document.getElementById('autoBtn');
    const resultsDiv = document.getElementById('results');
    const statusDiv = document.getElementById('status');
    const apiKeyInput = document.getElementById('apiKey');

    let isAuto = false;
    let autoInterval = null;

    startBtn.onclick = async () => {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            video.srcObject = stream;
            analyzeBtn.disabled = false;
            autoBtn.disabled = false;
            statusDiv.innerText = "Écran capturé";
        } catch (err) { alert("Erreur: " + err); }
    };

    async function process() {
        const key = apiKeyInput.value;
        if (!key) return alert("Manque clé API");

        statusDiv.innerText = "Analyse en cours...";
        
        // Capture image
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Image = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Traduis en français tout le texte chinois visible sur cette image de boutique. Explique le produit et le prix." },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            
            resultsDiv.innerHTML = `<div class="translation-block"><strong>Mise à jour ${new Date().toLocaleTimeString()} :</strong><br>${text.replace(/\n/g, '<br>')}</div>` + resultsDiv.innerHTML;
            statusDiv.innerText = "Terminé";
        } catch (e) {
            statusDiv.innerText = "Erreur IA";
        }
    }

    analyzeBtn.onclick = process;

    autoBtn.onclick = () => {
        isAuto = !isAuto;
        autoBtn.innerText = isAuto ? "Auto: ON" : "Auto: OFF";
        autoBtn.style.background = isAuto ? "#e67e22" : "#c62828";

        if (isAuto) {
            autoInterval = setInterval(process, 15000); // Analyse toutes les 15 secondes
        } else {
            clearInterval(autoInterval);
        }
    };
</script>
</body>
</html>
