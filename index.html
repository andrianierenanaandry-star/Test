<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Diagnostic</title>
    <style>
        :root { --neon: #00fbff; --red: #ff4444; }
        body { margin: 0; background: #000; color: white; font-family: sans-serif; }
        #jarvis-btn {
            width: 70px; height: 70px; border: 2px solid var(--neon); border-radius: 50%;
            position: fixed; top: 20px; left: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--neon); background: #111; z-index: 1000;
        }
        #panel {
            padding: 20px; margin-top: 100px; background: #111; border: 1px solid var(--neon);
            margin-left: 10px; margin-right: 10px; border-radius: 15px;
        }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; box-sizing: border-box; }
        input { background: #222; color: white; border: 1px solid #444; }
        button { background: var(--neon); font-weight: bold; cursor: pointer; }
        #log { margin-top: 20px; padding: 10px; background: #000; border-radius: 5px; font-size: 12px; border: 1px solid #333; }
        .err { color: var(--red); font-weight: bold; border: 1px solid var(--red) !important; }
        .loader { width: 20px; height: 20px; border: 2px solid white; border-top: 2px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="jarvis-btn" onclick="document.getElementById('fileInput').click()">
    <span id="label">SCAN</span>
    <div id="loader" class="loader"></div>
</div>

<div id="panel">
    <h3 style="color:var(--neon); margin-top:0;">CONSOLE JARVIS</h3>
    
    <input type="text" id="urlInput" placeholder="Coller un lien ici...">
    <button onclick="testAI('link')">ANALYSER LE LIEN</button>
    
    <div id="log">En attente d'action...</div>

    <p style="font-size: 10px; color: #888; margin-top: 20px;">MA CLÉ API :</p>
    <input type="password" id="apiKey" placeholder="Coller la clé AIzaSy..." onchange="saveKey()">
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="testAI('image')">
</div>

<script>
    const log = document.getElementById('log');
    const loader = document.getElementById('loader');
    const label = document.getElementById('label');

    // Sauvegarde la clé dans le téléphone pour ne pas la retaper
    function saveKey() {
        localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
    }

    // Charger la clé au démarrage
    window.onload = () => {
        const saved = localStorage.getItem('gemini_key');
        if(saved) document.getElementById('apiKey').value = saved;
    }

    async function testAI(type) {
        const key = document.getElementById('apiKey').value.trim();
        const urlLink = document.getElementById('urlInput').value;
        
        if(!key) { log.innerHTML = "<span class='err'>ERREUR : Aucune clé API détectée !</span>"; return; }

        log.innerHTML = "Connexion à Google AI...";
        loader.style.display = "block";
        label.style.display = "none";

        let payload = { contents: [{ parts: [] }] };

        if(type === 'link') {
            payload.contents[0].parts.push({ text: "Analyse ce lien : " + urlLink });
        } else {
            const file = document.getElementById('fileInput').files[0];
            const base64 = await toBase64(file);
            payload.contents[0].parts.push({ text: "Traduis et explique cet écran" });
            payload.contents[0].parts.push({ inline_data: { mime_type: "image/jpeg", data: base64.split(',')[1] } });
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                // AFFICHE L'ERREUR DÉTAILLÉE DE GOOGLE
                log.innerHTML = `<div class='err'>ERREUR GOOGLE (${response.status}) :<br>${data.error ? data.error.message : JSON.stringify(data)}</div>`;
            } else {
                const text = data.candidates[0].content.parts[0].text;
                log.innerHTML = "<strong>RÉPONSE :</strong><br>" + text.replace(/\n/g, "<br>");
            }
        } catch (e) {
            log.innerHTML = `<div class='err'>ERREUR RÉSEAU :<br>${e.message}</div>`;
        } finally {
            loader.style.display = "none";
            label.style.display = "block";
        }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>
</body>
</html>
