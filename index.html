<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS V19</title>
    <style>
        :root { --jarvis: #00f2ff; --mistral: #ff5e00; --bg: #05070a; }
        body { 
            margin: 0; background: var(--bg); color: white; 
            font-family: sans-serif; display: flex; flex-direction: column; height: 100vh;
        }

        /* CONFIGURATION CLÉ API - BIEN VISIBLE EN HAUT */
        .api-box {
            background: #111;
            border: 2px solid var(--mistral);
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px var(--mistral);
        }
        .api-box label { display: block; font-size: 12px; color: var(--mistral); font-weight: bold; margin-bottom: 5px; }
        .api-box input { 
            width: 100%; background: #000; border: 1px solid #444; color: white; 
            padding: 10px; border-radius: 5px; box-sizing: border-box; font-size: 14px;
        }

        /* Fenêtre de Chat */
        #chat { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
        .ai { align-self: flex-start; background: #1a1f26; border: 1px solid #30363d; border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--jarvis); color: black; font-weight: bold; border-bottom-right-radius: 2px; }

        /* Bouton Scan */
        .footer { padding: 20px; background: #0d1117; display: flex; justify-content: center; border-top: 1px solid #222; }
        #scan-btn {
            width: 70px; height: 70px; border: 3px solid var(--jarvis); border-radius: 50%;
            background: #000; cursor: pointer; box-shadow: 0 0 20px var(--jarvis);
            display: flex; align-items: center; justify-content: center;
        }
        #scan-btn:active { transform: scale(0.9); }
        #scan-btn div { width: 20px; height: 20px; background: var(--jarvis); border-radius: 50%; }

        .loader { display: none; text-align: center; color: var(--jarvis); padding: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- LA CASE POUR TA CLÉ API -->
    <div class="api-box">
        <label>CONFIGURER CERVEAU MISTRAL :</label>
        <input type="password" id="apiKey" placeholder="Colle ta clé API ici..." onchange="saveKey(this.value)">
        <div style="font-size: 9px; color: #888; margin-top: 5px;">Ta clé est enregistrée localement dans ton téléphone.</div>
    </div>

    <div id="chat">
        <div class="msg ai">Monsieur, la case de configuration est juste au-dessus. Collez votre clé Mistral, puis appuyez sur le bouton SCAN bleu en bas pour m'envoyer un screenshot chinois.</div>
    </div>

    <div id="loader">ANALYSE JARVIS EN COURS...</div>

    <div class="footer">
        <div id="scan-btn" onclick="document.getElementById('fileInput').click()">
            <div></div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">

<script>
    const chat = document.getElementById('chat');
    const loader = document.getElementById('loader');
    const apiKeyInput = document.getElementById('apiKey');

    // Sauvegarde auto
    function saveKey(v) { localStorage.setItem('mistral_v19', v.trim()); }
    
    // Chargement auto
    window.onload = () => {
        const saved = localStorage.getItem('mistral_v19');
        if(saved) apiKeyInput.value = saved;
    };

    function addMsg(type, text) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = text.replace(/\n/g, '<br>');
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    async function handleImage(e) {
        const file = e.target.files[0];
        if(!file) return;

        const key = apiKeyInput.value || localStorage.getItem('mistral_v19');
        if(!key) { alert("Veuillez d'abord remplir la case orange en haut !"); return; }

        addMsg('user', "Analyse de mon écran...");
        loader.style.display = 'block';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const base64 = reader.result;
            await askMistral(key, base64);
        };
    }

    async function askMistral(key, img) {
        const prompt = "Tu es Jarvis. Analyse cet écran d'application chinoise. Traduis le texte important en français. Explique le produit, le prix en Yuans et Euros, et dis-moi si c'est fiable.";
        
        try {
            const resp = await fetch("https://api.mistral.ai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                body: JSON.stringify({
                    model: "pixtral-12b-latest",
                    messages: [{
                        role: "user",
                        content: [
                            { type: "text", text: prompt },
                            { type: "image_url", image_url: img }
                        ]
                    }]
                })
            });

            const data = await resp.json();
            if(data.error) {
                addMsg('ai', "ERREUR : " + data.error.message);
            } else {
                addMsg('ai', data.choices[0].message.content);
            }
        } catch (err) {
            addMsg('ai', "ERREUR RÉSEAU : Impossible de joindre Mistral.");
