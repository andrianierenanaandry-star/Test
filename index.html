<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS GROQ V10</title>
    <style>
        :root { --neon: #00ff41; } /* Vert Matrix/Groq */
        body { margin: 0; background: #000; color: white; font-family: 'Courier New', monospace; text-align: center; }
        #jarvis-btn {
            width: 80px; height: 80px; border: 2px solid var(--neon); border-radius: 50%;
            margin: 30px auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--neon); background: #050505; cursor: pointer;
        }
        #panel { padding: 20px; border: 1px solid var(--neon); margin: 15px; border-radius: 10px; background: #0a0a0a; }
        button { width: 100%; padding: 15px; background: var(--neon); color: #000; font-weight: bold; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        #log { margin-top: 20px; padding: 15px; text-align: left; font-size: 13px; border-left: 3px solid var(--neon); background: #000; min-height: 50px; }
        input { width: 100%; padding: 10px; margin-top: 10px; background: #111; color: var(--neon); border: 1px solid var(--neon); border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2 style="color:var(--neon); margin-top: 20px;">JARVIS-GROQ V10</h2>
    <p style="font-size: 10px;">SYSTÈME SANS FACTURATION - LLAMA 3.2 VISION</p>

    <div id="jarvis-btn" onclick="document.getElementById('fileInput').click()">
        <b style="color:var(--neon)">SCAN</b>
    </div>

    <div id="panel">
        <button onclick="runGroq('link')">ANALYSER LE LIEN CI-DESSOUS</button>
        <input type="text" id="linkInput" placeholder="Coller lien ici...">
        
        <div id="log">En attente de signal...</div>

        <p style="font-size: 10px; color: #555; margin-top: 20px;">CLÉ API GROQ (gsk_...) :</p>
        <input type="password" id="apiKey" placeholder="Coller clé gsk_ ici..." onchange="localStorage.setItem('groq_key', this.value)">
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="runGroq('image')">
    </div>

<script>
    // Charger la clé au démarrage
    window.onload = () => {
        const saved = localStorage.getItem('groq_key');
        if(saved) document.getElementById('apiKey').value = saved;
    }

    async function runGroq(mode) {
        const key = document.getElementById('apiKey').value.trim();
        const log = document.getElementById('log');
        if(!key) { alert("ERREUR : Manque la clé GROQ !"); return; }

        log.innerHTML = "<span style='color:var(--neon)'>Jarvis (Groq) réfléchit...</span>";

        const url = "https://api.groq.com/openai/v1/chat/completions";
        let messages = [];

        if(mode === 'image') {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;
            const base64 = await new Promise(r => {
                const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(file);
            });
            
            messages = [{
                role: "user",
                content: [
                    { type: "text", text: "Agis comme Jarvis. Analyse ce screenshot, traduis le chinois en français et explique tout précisément (prix, produit, fiabilité)." },
                    { type: "image_url", image_url: { url: base64 } }
                ]
            }];
        } else {
            const link = document.getElementById('linkInput').value;
            if(!link) return;
            messages = [{
                role: "user",
                content: "Agis comme Jarvis. Analyse ce lien et explique moi le contenu en français : " + link
            }];
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${key}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    model: "llama-3.2-11b-vision-preview",
                    messages: messages,
                    temperature: 0.5
                })
            });

            const data = await response.json();
            if(data.error) {
                log.innerHTML = "<b style='color:red'>ERREUR GROQ :</b> " + data.error.message;
            } else {
                const answer = data.choices[0].message.content;
                log.innerHTML = "<b>JARVIS :</b><br><br>" + answer.replace(/\n/g, "<br>");
                // Voix
                const speech = new SpeechSynthesisUtterance(answer.substring(0, 200));
                speech.lang = 'fr-FR';
                window.speechSynthesis.speak(speech);
            }
        } catch (e) {
            log.innerHTML = "<b style='color:red'>ERREUR RÉSEAU :</b> " + e.message;
        }
    }
</script>
</body>
</html>
