<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS V6</title>
    <style>
        /* CHANGEMENT DE COULEUR POUR VÉRIFIER LA MISE À JOUR */
        :root { --color: #ff9800; } 
        body { margin: 0; background: #000; color: white; font-family: sans-serif; text-align: center; }
        #jarvis-btn {
            width: 80px; height: 80px; border: 4px solid var(--color); border-radius: 50%;
            margin: 30px auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px var(--color); background: #111; cursor: pointer;
        }
        #panel { padding: 20px; background: #111; border: 2px solid var(--color); margin: 15px; border-radius: 15px; }
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; background: var(--color); font-weight: bold; color: black; }
        #log { margin-top: 20px; padding: 15px; background: #000; border-radius: 8px; border-left: 4px solid var(--color); text-align: left; }
    </style>
</head>
<body>

    <h2 style="color:var(--color); margin-top: 20px;">SYSTEM JARVIS V6</h2>
    <p style="font-size: 12px;">SI CE TEXTE N'EST PAS ORANGE, LE CODE N'EST PAS À JOUR</p>

    <div id="jarvis-btn" onclick="document.getElementById('fileInput').click()">
        <b style="color:var(--color)">SCAN</b>
    </div>

    <div id="panel">
        <input type="text" id="urlInput" placeholder="Lien ici..." style="width:100%; padding:10px; border-radius:5px; background:#222; color:white; border:1px solid #444;">
        <button onclick="startAI()">ANALYSER</button>
        <div id="log">En attente de la clé API...</div>
        <input type="password" id="apiKey" placeholder="Clé AIza..." style="width:100%; padding:10px; margin-top:20px;" onchange="localStorage.setItem('v6_key', this.value)">
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="startAI()">
    </div>

<script>
    window.onload = () => {
        const saved = localStorage.getItem('v6_key');
        if(saved) document.getElementById('apiKey').value = saved;
    }

    async function startAI() {
        const key = document.getElementById('apiKey').value.trim();
        const log = document.getElementById('log');
        if(!key) { alert("ERREUR : Colle ta clé API en bas !"); return; }

        log.innerHTML = "Analyse v6 en cours...";

        // L'URL CORRIGÉE (VERSION 1 STABLE)
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;

        const body = { contents: [{ parts: [{ text: "Explique cet écran ou ce lien en français." }] }] };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();
            if (data.error) {
                log.innerHTML = "<b style='color:red'>ERREUR GOOGLE :</b> " + data.error.message;
            } else {
                log.innerHTML = "<b>JARVIS :</b><br><br>" + data.candidates[0].content.parts[0].text.replace(/\n/g, "<br>");
            }
        } catch (e) {
            log.innerHTML = "Erreur de connexion : " + e.message;
        }
    }
</script>
</body>
</html>
