<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Widget v3</title>
    <style>
        :root { --neon: #00fbff; --dark: #0a0a0a; }
        body { margin: 0; padding: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
        #jarvis-circle {
            width: 60px; height: 60px; background: var(--dark); border: 2px solid var(--neon);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--neon); cursor: pointer; position: fixed; top: 10px; left: 10px;
            z-index: 1000; transition: 0.3s;
        }
        #panel {
            display: none; width: 95vw; max-height: 80vh; background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--neon); border-radius: 15px; position: fixed; top: 80px; left: 2.5vw;
            color: white; padding: 15px; box-sizing: border-box; overflow-y: auto; z-index: 999;
        }
        .loader { width: 20px; height: 20px; border: 2px solid var(--neon); border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input { width: 100%; background: #222; border: 1px solid var(--neon); color: white; padding: 10px; margin-top: 10px; border-radius: 5px; }
        button { width:100%; margin-top:10px; background:var(--neon); border:none; padding:12px; font-weight:bold; border-radius:5px; cursor:pointer; }
        #result { font-size: 13px; line-height: 1.4; margin-top: 10px; color: #eee; }
        .close-btn { color: var(--neon); float: right; font-weight: bold; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

<div id="jarvis-circle" onclick="handleClick()">
    <span id="icon" style="color: var(--neon); font-weight: bold; font-size: 10px;">JARVIS</span>
    <div id="mini-loader" class="loader"></div>
</div>

<div id="panel">
    <span class="close-btn" onclick="togglePanel()">X</span>
    <div id="status" style="color: var(--neon); font-size: 11px; margin-bottom:10px;">SYSTÈME JARVIS PRÊT</div>
    
    <div id="link-section">
        <input type="text" id="urlInput" placeholder="Coller lien vidéo ou web ici...">
        <button onclick="analyzeUrl()">ANALYSER LIEN</button>
    </div>

    <div id="result">
        - 1 clic : Analyser Screenshot<br>
        - Coller lien : Analyser Vidéo/Web
    </div>

    <input type="password" id="apiKey" placeholder="Colle ta clé API Gemini ici..." style="font-size: 11px; margin-top: 20px; border-color: #444;">
    <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<script>
    const panel = document.getElementById('panel');
    const resultDiv = document.getElementById('result');
    const fileInput = document.getElementById('fileInput');
    const miniLoader = document.getElementById('mini-loader');
    const icon = document.getElementById('icon');
    const apiKeyInput = document.getElementById('apiKey');

    function togglePanel() { panel.style.display = (panel.style.display === 'block') ? 'none' : 'block'; }

    function handleClick() {
        // Si le panneau est fermé, on demande le screenshot
        if(panel.style.display !== 'block') {
            fileInput.click();
        }
    }

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];
            processAI("Analyse ce screenshot : traduis le chinois, explique le produit et le prix.", base64);
        };
        reader.readAsDataURL(file);
    };

    async function analyzeUrl() {
        const url = document.getElementById('urlInput').value;
        if (!url) { alert("Veuillez coller un lien"); return; }
        processAI(`Analyse ce lien : ${url}. Explique-moi ce que c'est et ce qu'il faut retenir.`);
    }

    async function processAI(prompt, image = null) {
        const key = apiKeyInput.value.trim();
        if (!key) { 
            togglePanel();
            resultDiv.innerHTML = "<span style='color:red'>ERREUR : La clé API est vide en bas du panneau !</span>";
            return; 
        }

        panel.style.display = 'block';
        miniLoader.style.display = 'block';
        icon.style.display = 'none';
        resultDiv.innerHTML = "Jarvis analyse les données...";

        const payload = {
            contents: [{ parts: [{ text: prompt }] }]
        };
        if (image) {
            payload.contents[0].parts.push({ inline_data: { mime_type: "image/jpeg", data: image } });
        }

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await resp.json();

            // VERIFICATION D'ERREUR DE LA CLÉ
            if (data.error) {
                throw new Error(data.error.message);
            }

            if (!data.candidates || !data.candidates[0]) {
                throw new Error("L'IA n'a pas renvoyé de réponse. Vérifiez votre contenu.");
            }

            const text = data.candidates[0].content.parts[0].text;
            resultDiv.innerHTML = "<strong>JARVIS :</strong><br>" + text.replace(/\n/g, '<br>');
            
        } catch (e) {
            resultDiv.innerHTML = "<span style='color:red'>ERREUR JARVIS : " + e.message + "</span>";
        } finally {
            miniLoader.style.display = 'none';
            icon.style.display = 'block';
        }
    }
</script>
</body>
</html>
